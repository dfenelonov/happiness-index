# Прод-запуск на VPS: docker compose up -d --build
# HTTPS через Caddy: задай DOMAIN в .env и запусти с профилем https:
#   docker compose --profile https up -d --build
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false   # без .env (например, в CI) всё работает на моках
    environment:
      DATABASE_URL: file:/data/app.db
      APP_INTERNAL_URL: http://127.0.0.1:3000
    volumes:
      - app-data:/data
    ports:
      - "${APP_PORT:-3000}:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Ежедневный бэкап SQLite в S3 (BACKUP_* в .env), хранение 14 дней. Без настроек — пишет
  # предупреждение, шлёт алерт и останавливается. Восстановление — LAUNCH.md.
  backup:
    build: .
    command: ["node", "--import", "tsx", "scripts/backup.ts", "--daily"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: file:/data/app.db
    volumes:
      - app-data:/data
    depends_on: [app]
    restart: on-failure

  caddy:
    image: caddy:2.8
    profiles: ["https"]
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-localhost}   # задай свой домен в .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    restart: unless-stopped

volumes:
  app-data:
  caddy-data:
