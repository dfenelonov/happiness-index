# Настройки продукта, которые меняются без правки кода. Схема — lib/config.ts.

site_name: "Индекс счастья"

landing:
  headline: "Индекс счастья в России падает. А какой у тебя?"
  subheadline: "5 минут, без регистрации"

pricing:
  # A/B-тест цены: вариант назначается случайно при первом визите (cookie), ?price=490 переопределяет
  variants_rub: [490, 690, 990]
  refund_days: 14

paywall:
  title: "Полный разбор"
  bullets:
    - "Разбор по твоим ответам: что поднимает индекс, а что тянет вниз"
    - "Почему именно эти утечки счастья — и как они связаны между собой"
    - "Что делать человеку с твоим типом: сильные стороны и ловушки"
    - "План на 30 дней: по неделям, с маленькими шагами"
    - "PDF, который останется у тебя"

fake_door:
  name: "Трекер счастья"
  price_rub_month: 390
  pitch: "Раз в неделю 1 минута — и ты видишь, как меняется твой индекс и что на него влияет."

percentile:
  # Пока настоящих результатов (не seed) меньше порога, перцентиль считается вместе с синтетическим
  # seed и на странице есть пометка. С порога seed исключается автоматически, пометка пропадает.
  real_results_threshold: 500

alerts:
  # Алерты — в Telegram (TELEGRAM_ALERT_BOT_TOKEN, TELEGRAM_ALERT_CHAT_ID), без них — только в лог.
  throttle_minutes: 10          # один и тот же повод — не чаще раза в N минут
  errors_5xx_threshold: 10      # всплеск: столько ответов 5xx…
  errors_5xx_window_minutes: 5  # …за это окно

backup:
  retention_days: 14            # дампы старше удаляются из хранилища
  hour_utc: 0                   # ежедневный бэкап в это время (UTC; 0 = 03:00 МСК)

metrics:
  # Пороги MVP. Цвет в /admin: зелёный — ≥ go, красный — < stop, жёлтый — между.
  completion: {name: "Старт → завершил тест", go: 0.60, stop: 0.45}
  share: {name: "Завершил → поделился", go: 0.08, stop: 0.04}
  purchase: {name: "Завершил → купил отчёт", go: 0.025, stop: 0.012}
  subscription: {name: "Купил → кликнул «подписка»", go: 0.05, stop: null}

report:
  # Генерация — фоновым воркером после оплаты. Время каждой попытки пишется в лог (llm_attempt)
  # и в reports.duration_ms: по первым реальным вызовам подбери таймаут.
  max_attempts: 3               # попытки у внешней LLM, затем — запасной отчёт на шаблонах
  attempt_timeout_seconds: 60
  retry_pause_seconds: 10       # пауза между попытками
  stale_after_minutes: 5        # генерация без «пульса» дольше — считается зависшей и перезапускается
  worker_interval_seconds: 300  # воркер подбирает оплаченные заказы без отчёта при старте и с этим шагом
  alert_no_report_minutes: 10   # оплачен, а отчёта нет дольше — алерт
  low_index_threshold: 40       # ниже — мягкая рекомендация поговорить со специалистом
