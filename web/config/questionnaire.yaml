# Единственный источник правды по тесту: вопросы, шкалы, веса, оси, типы, утечки, пороги.
# Код подсчёта (lib/scoring.ts) читает всё отсюда; схема проверяется при старте (lib/config.ts).
#
# Тексты: собственные утверждения проекта и пункты IPIP (ipip.ori.org, общественное достояние).
# Лицензионные методики не используем. Обращение — на «ты».

version: 1

scale:
  min: 1
  max: 5
  labels: ["Совсем не согласен", "Скорее не согласен", "Ни то ни другое", "Скорее согласен", "Полностью согласен"]

# Прямой вопрос — свои 5 вариантов (как в опросах ВЦИОМ), в индекс не входит.
direct_options:
  - {id: definitely_yes, label: "Определённо да", happy: true}
  - {id: rather_yes, label: "Скорее да", happy: true}
  - {id: hard_to_say, label: "Затрудняюсь ответить", happy: null}
  - {id: rather_no, label: "Скорее нет", happy: false}
  - {id: definitely_no, label: "Определённо нет", happy: false}

# Порядок в тесте = порядок в списке. kind: direct | life | axis | leak.
# weight — вес пункта в индексе (только life). reverse — обратный ключ (6 − x).
questions:
  - {id: direct, kind: direct, text: "В жизни бывает всякое: и хорошее, и плохое. Но если говорить в целом, ты счастлив или нет?"}

  - {id: life_1, kind: life, weight: 1.0, text: "Моя жизнь сейчас во многом такая, какой мне хотелось бы её видеть"}
  - {id: life_2, kind: life, weight: 1.0, text: "В целом меня устраивает, как всё складывается"}
  - {id: life_3, kind: life, weight: 1.0, text: "Мне есть чем гордиться в моей жизни"}
  - {id: life_4, kind: life, weight: 1.0, text: "Я редко ловлю себя на мысли, что живу не своей жизнью"}
  - {id: life_5, kind: life, weight: 1.0, text: "Когда я думаю о ближайшем годе, я чаще чувствую надежду, чем тревогу"}
  - {id: life_6, kind: life, weight: 1.0, text: "Большинство моих дней приносят что-то хорошее"}
  - {id: life_7, kind: life, weight: 1.0, text: "Я чувствую, что живу в согласии с собой"}
  - {id: life_8, kind: life, weight: 1.0, text: "Я часто замечаю радость в простых вещах"}

  - {id: leak_sleep_1, kind: leak, zone: sleep, text: "Сон обычно восстанавливает мои силы"}
  - {id: leak_rel_1, kind: leak, zone: relationships, text: "Мне есть с кем поделиться тем, что меня волнует"}
  - {id: leak_work_1, kind: leak, zone: work, text: "Моя работа или учёба чаще даёт силы, чем отнимает"}
  - {id: leak_money_1, kind: leak, zone: money, text: "Мысли о деньгах редко мешают мне жить спокойно"}
  - {id: leak_meaning_1, kind: leak, zone: meaning, text: "У меня есть цели, которые меня по-настоящему вдохновляют"}
  - {id: leak_sleep_2, kind: leak, zone: sleep, text: "Мне хватает энергии на то, что для меня важно"}
  - {id: leak_rel_2, kind: leak, zone: relationships, text: "Я чувствую близость с важными для меня людьми"}
  - {id: leak_work_2, kind: leak, zone: work, text: "Я понимаю, зачем делаю то, что делаю на работе или учёбе"}
  - {id: leak_money_2, kind: leak, zone: money, text: "Я чувствую, что контролирую свои финансы"}
  - {id: leak_meaning_2, kind: leak, zone: meaning, text: "Я чувствую, что моя жизнь движется в нужную сторону"}

  # Оси типа: пункты IPIP. Для устойчивости пункты про перепады настроения — с обратным ключом.
  - {id: axis_energy_1, kind: axis, axis: energy, reverse: false, text: "Я душа компании"}
  - {id: axis_stability_1, kind: axis, axis: stability, reverse: true, text: "Моё настроение часто меняется"}
  - {id: axis_openness_1, kind: axis, axis: openness, reverse: false, text: "У меня живое воображение"}
  - {id: axis_energy_2, kind: axis, axis: energy, reverse: true, text: "В компании я предпочитаю держаться в тени"}
  - {id: axis_stability_2, kind: axis, axis: stability, reverse: false, text: "Большую часть времени я чувствую себя спокойно"}
  - {id: axis_openness_2, kind: axis, axis: openness, reverse: true, text: "Абстрактные идеи мне неинтересны"}
  - {id: axis_energy_3, kind: axis, axis: energy, reverse: false, text: "В компании я общаюсь с множеством разных людей"}
  - {id: axis_stability_3, kind: axis, axis: stability, reverse: true, text: "Меня легко расстроить"}
  - {id: axis_openness_3, kind: axis, axis: openness, reverse: true, text: "Воображение — не моя сильная сторона"}

scoring:
  index:
    # индекс = round(Σ w·(x − 1) / Σ w·4 · 100), 0–100, по вопросам kind: life
    levels:   # для текстов результата и отчёта; нижняя граница включительно
      - {id: low, min: 0, name: "ниже среднего"}
      - {id: mid, min: 45, name: "средний"}
      - {id: high, min: 70, name: "высокий"}

  axes:
    # балл оси = среднее с учётом обратных (6 − x), 1–5; в интерфейсе — (m − 1) / 4 · 100
    threshold: 3.0   # «высокий полюс» = среднее строго > threshold
    list:
      energy: {name: "Энергия", high: "заряжаешься от людей", low: "заряжаешься в тишине"}
      stability: {name: "Эмоциональная устойчивость", high: "спокойно переносишь встряски", low: "глубоко всё проживаешь"}
      openness: {name: "Открытость новому", high: "тянешься к новому", low: "ценишь проверенное"}

  leaks:
    count: 3
    # при равных баллах раньше идёт зона левее в списке
    tie_break_order: [sleep, relationships, work, money, meaning]

zones:
  sleep:
    name: "Сон и энергия"
    leak: "Тебе не хватает сил — а без них трудно радоваться даже хорошему."
  relationships:
    name: "Отношения"
    leak: "Тебе не хватает близости и поддержки — одной из главных опор счастья."
  work:
    name: "Работа"
    leak: "Работа или учёба сейчас больше забирает, чем даёт."
  money:
    name: "Деньги"
    leak: "Мысли о деньгах отнимают спокойствие."
  meaning:
    name: "Смысл"
    leak: "Не хватает ощущения, что жизнь движется туда, куда хочется."

archetypes:
  - id: pathfinder
    when: {energy: high, stability: high, openness: high}
    name: "Первооткрыватель"
    slogan: "Иду туда, где ещё не был"
    description: >-
      Ты заряжаешься от людей и новых идей и легко переносишь неопределённость. Там, где другие
      ждут гарантий, ты уже пробуешь. Тебе важно движение: застой утомляет тебя быстрее, чем
      нагрузка. Твоя задача — не растерять силы, распыляясь на всё интересное сразу.
  - id: sunny_strategist
    when: {energy: high, stability: high, openness: low}
    name: "Солнечный стратег"
    slogan: "Спокойно делаю, что задумал"
    description: >-
      Ты общителен, спокоен и практичен. Люди рядом с тобой чувствуют, что всё под контролем.
      Ты любишь понятные планы и доводишь начатое до конца. Счастье для тебя — когда жизнь
      устроена надёжно и в ней есть место тёплым встречам.
  - id: inspirer
    when: {energy: high, stability: low, openness: high}
    name: "Вдохновитель"
    slogan: "Горю идеями и людьми"
    description: >-
      Ты горишь идеями и людьми и глубоко всё проживаешь — и радость, и тревогу. С тобой
      интересно: ты замечаешь возможности, которые другие пропускают. Эмоции дают тебе
      энергию, но иногда и забирают её. Тебе важно научиться вовремя выдыхать.
  - id: warm_center
    when: {energy: high, stability: low, openness: low}
    name: "Тёплый центр"
    slogan: "Своих не бросаю"
    description: >-
      Ты тянешься к людям и живо на всё откликаешься. Тебе важно, чтобы рядом были свои, а
      жизнь шла понятным путём. Ты чутко ловишь настроение компании и часто держишь её вместе.
      Опора для тебя — люди и привычный уклад, поэтому перемены ты чувствуешь острее других.
  - id: quiet_explorer
    when: {energy: low, stability: high, openness: high}
    name: "Тихий исследователь"
    slogan: "Разбираюсь в сути"
    description: >-
      Ты черпаешь силы в тишине и любопытстве. Спокоен, вдумчив, любишь разбираться в сути
      вещей. Тебе не нужна шумная компания, чтобы чувствовать себя живым, — хватит хорошей
      книги, идеи или разговора вдвоём. Главный риск — уйти в себя слишком глубоко.
  - id: steady_anchor
    when: {energy: low, stability: high, openness: low}
    name: "Надёжный якорь"
    slogan: "На меня можно опереться"
    description: >-
      Ты спокоен, сдержан и последователен. На тебя можно опереться, и люди это чувствуют.
      Ты ценишь проверенное и не гонишься за модой. Твоё счастье тихое и прочное — его
      легко недооценить, но трудно разрушить.
  - id: sensitive_dreamer
    when: {energy: low, stability: low, openness: high}
    name: "Чуткий мечтатель"
    slogan: "Чувствую больше, чем говорю"
    description: >-
      Ты тонко чувствуешь и много размышляешь. Богатый внутренний мир — твоя сила и твоя
      нагрузка одновременно. Ты замечаешь оттенки, которых не видят другие, и умеешь
      придумывать. Тебе особенно важны бережный ритм и люди, с которыми можно быть собой.
  - id: careful_keeper
    when: {energy: low, stability: low, openness: low}
    name: "Бережный хранитель"
    slogan: "Берегу то, что важно"
    description: >-
      Ты бережно относишься к людям и привычному укладу и остро чувствуешь перемены. Тебе
      важны предсказуемость и тишина, в которых можно восстановиться. Ты верен своим и
      надёжен в мелочах. Счастье для тебя складывается из маленьких устойчивых радостей.

# Сравнение со страной (строка под прямым вопросом)
country:
  # TODO: проверить актуальные данные ВЦИОМ (https://wciom.ru/ratings/indeks-schastja) перед запуском
  share_happy: 0.74
  period: "апрель 2026"
  source_name: "ВЦИОМ"
  source_url: "https://wciom.ru/ratings/indeks-schastja"
  texts:
    definitely_yes: "Ты среди {happy}% россиян, кто считает себя счастливым."
    rather_yes: "Ты скорее счастлив — как и {happy}% россиян."
    hard_to_say: "Тебе сложно ответить однозначно. Счастливыми себя называют {happy}% россиян."
    rather_no: "Сейчас ты не чувствуешь себя счастливым — и ты в этом не один. Ниже — что больше всего отнимает у тебя силы."
    definitely_no: "Сейчас тебе непросто — и ты в этом не один. Ниже — что больше всего отнимает у тебя силы."
