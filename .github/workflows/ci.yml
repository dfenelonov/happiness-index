# CI для основной версии (web/). Всё на моках: оплата, LLM, письма, Метрика — секреты не нужны.
name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  checks:
    name: lint · typecheck · unit · smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke (in-process HTTP, весь путь на моках)
        run: npm run smoke

  e2e:
    name: e2e · screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright e2e
        run: npm run test:e2e
      - name: Screenshots
        if: success() || failure()
        run: npm run screenshots
        env:
          PW_REPORT_DIR: playwright-report-screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: web/docs/screenshots
          if-no-files-found: warn
      - name: Upload Playwright reports and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/playwright-report-screenshots
            web/test-results
          if-no-files-found: warn

  docker:
    name: docker compose build · healthcheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Прод-конфигурация не задаёт UNSAFE_SKIP_PRODUCTION_CHECKS
        run: |
          if grep -n "UNSAFE_SKIP_PRODUCTION_CHECKS" docker-compose.yml .env.example; then
            echo "Флаг обхода проверок найден в прод-конфигурации"; exit 1
          fi
          if docker compose --profile https config | grep -n "UNSAFE_SKIP_PRODUCTION_CHECKS"; then
            echo "Флаг обхода проверок попал в итоговый compose"; exit 1
          fi
      - run: docker compose build app backup
      - name: Без настроек production контейнер не стартует
        run: |
          set +e
          out=$(docker compose run --rm --no-deps app 2>&1); code=$?
          echo "$out" | tail -8
          [ $code -ne 0 ] && echo "$out" | grep -q "Запуск в production остановлен"
      - name: Start container (моки; флаг задаётся только здесь, в CI)
        run: |
          printf "UNSAFE_SKIP_PRODUCTION_CHECKS=true\nSUPPORT_EMAIL=support@example.ru\n" > .env
          docker compose up -d app
      - name: Healthcheck — главная страница
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/ -o /tmp/index.html && grep -q "Пройти тест" /tmp/index.html; then
              echo "главная отвечает"
              curl -fsS http://127.0.0.1:3000/api/health
              exit 0
            fi
            sleep 2
          done
          echo "главная не ответила за 120 с"
          exit 1
      - name: Бэкап и проверочное восстановление в контейнере (папка вместо S3)
        run: |
          docker compose run --rm -e BACKUP_DIR=/data/backups backup node --import tsx scripts/backup.ts
          docker compose run --rm -e BACKUP_DIR=/data/backups backup node --import tsx scripts/restore.ts --latest --to /tmp/restore-check.db | tee /tmp/restore.log
          grep -q "integrity_check: ok" /tmp/restore.log
      - name: Container logs
        if: always()
        run: docker compose logs app
      - name: Stop
        if: always()
        run: docker compose down -v
