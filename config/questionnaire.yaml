# Единственный источник правды по тесту. Код подсчёта читает правила отсюда.
# Все тексты — собственные утверждения проекта или пункты IPIP (общественное достояние, ipip.ori.org).
# Лицензионные шкалы не используем.

version: 1

scales:
  agree5:   # для Большой пятёрки и утечек
    min: 1
    max: 5
    labels: ["Совсем не согласен", "Скорее не согласен", "Ни то ни другое", "Скорее согласен", "Полностью согласен"]
  agree7:   # для индекса счастья (блок life)
    min: 1
    max: 7
    labels: ["Совершенно не согласен", "Не согласен", "Скорее не согласен", "Ни то ни другое",
             "Скорее согласен", "Согласен", "Полностью согласен"]
  vciom5:
    options:
      - {id: definitely_yes, label: "Определённо да", happy: true}
      - {id: rather_yes, label: "Скорее да", happy: true}
      - {id: rather_no, label: "Скорее нет", happy: false}
      - {id: definitely_no, label: "Определённо нет", happy: false}
      - {id: hard_to_say, label: "Затрудняюсь ответить", happy: null}

# Порядок блоков в тесте = порядок в этом списке (36 вопросов)
blocks:
  - id: vciom
    title: "Для начала"
    items:
      - id: vciom_1
        scale: vciom5
        text: "В жизни бывает всякое: и хорошее, и плохое. Но если говорить в целом, ты счастлив или нет?"

  - id: life
    title: "Твоя жизнь в целом"
    source: "Методика проекта"
    scale: agree7
    items:
      - {id: life_1, text: "Моя жизнь сейчас во многом такая, какой мне хотелось бы её видеть"}
      - {id: life_2, text: "В целом меня устраивает, как всё складывается"}
      - {id: life_3, text: "Мне есть чем гордиться в моей жизни"}
      - {id: life_4, text: "Я редко ловлю себя на мысли, что живу не своей жизнью"}
      - {id: life_5, text: "Когда я думаю о ближайшем годе, я чаще чувствую надежду, чем тревогу"}

  - id: leaks
    title: "Из чего складывается твой день"
    source: "Собственные утверждения проекта"
    scale: agree5
    items:
      - {id: leak_sleep_1, domain: sleep, text: "Сон обычно восстанавливает мои силы"}
      - {id: leak_sleep_2, domain: sleep, text: "Мне хватает энергии на то, что для меня важно"}
      - {id: leak_rel_1, domain: relationships, text: "Мне есть с кем поделиться тем, что меня волнует"}
      - {id: leak_rel_2, domain: relationships, text: "Я чувствую близость с важными для меня людьми"}
      - {id: leak_work_1, domain: work, text: "Моя работа или учёба чаще даёт силы, чем отнимает"}
      - {id: leak_work_2, domain: work, text: "Я понимаю, зачем делаю то, что делаю на работе или учёбе"}
      - {id: leak_money_1, domain: money, text: "Мысли о деньгах редко мешают мне жить спокойно"}
      - {id: leak_money_2, domain: money, text: "Я чувствую, что контролирую свои финансы"}
      - {id: leak_meaning_1, domain: meaning, text: "У меня есть цели, которые меня по-настоящему вдохновляют"}
      - {id: leak_meaning_2, domain: meaning, text: "Я чувствую, что моя жизнь движется в нужную сторону"}

  - id: big5
    title: "Какой ты"
    source: "Модель Большой пятёрки, пункты IPIP (ipip.ori.org, общественное достояние); Donnellan et al., 2006"
    scale: agree5
    items:
      - {id: big5_1, trait: E, reverse: false, text: "Я душа компании"}
      - {id: big5_2, trait: A, reverse: false, text: "Я сопереживаю другим людям"}
      - {id: big5_3, trait: C, reverse: false, text: "Я делаю дела сразу, не откладывая"}
      - {id: big5_4, trait: N, reverse: false, text: "Моё настроение часто меняется"}
      - {id: big5_5, trait: O, reverse: false, text: "У меня живое воображение"}
      - {id: big5_6, trait: E, reverse: true, text: "Я обычно говорю мало"}
      - {id: big5_7, trait: A, reverse: true, text: "Чужие проблемы меня не особо волнуют"}
      - {id: big5_8, trait: C, reverse: true, text: "Я часто забываю положить вещи на место"}
      - {id: big5_9, trait: N, reverse: true, text: "Большую часть времени я чувствую себя спокойно"}
      - {id: big5_10, trait: O, reverse: true, text: "Абстрактные идеи мне неинтересны"}
      - {id: big5_11, trait: E, reverse: false, text: "В компании я общаюсь с множеством разных людей"}
      - {id: big5_12, trait: A, reverse: false, text: "Я легко чувствую эмоции других людей"}
      - {id: big5_13, trait: C, reverse: false, text: "Мне нравится порядок"}
      - {id: big5_14, trait: N, reverse: false, text: "Меня легко расстроить"}
      - {id: big5_15, trait: O, reverse: true, text: "Мне сложно даются абстрактные идеи"}
      - {id: big5_16, trait: E, reverse: true, text: "В компании я предпочитаю держаться в тени"}
      - {id: big5_17, trait: A, reverse: true, text: "Другие люди мне, по правде говоря, не очень интересны"}
      - {id: big5_18, trait: C, reverse: true, text: "Я часто оставляю после себя беспорядок"}
      - {id: big5_19, trait: N, reverse: true, text: "Мне редко бывает грустно"}
      - {id: big5_20, trait: O, reverse: true, text: "Воображение — не моя сильная сторона"}

scoring:
  happiness_index:
    block: life
    # индекс = round((sum - 5) / 30 * 100)
    raw_min: 5
    raw_max: 35

  vciom:
    block: vciom             # ответ хранится как id варианта, в индекс не входит

  traits:
    block: big5              # Mini-IPIP: 4 пункта на черту
    items_per_trait: 4
    reverse_formula: "6 - x"
    aggregate: mean          # среднее 4 пунктов с учётом обратных, 1–5
    display_0_100: "(m - 1) / 4 * 100"

  domains:
    block: leaks
    aggregate: mean
    leaks_count: 3
    tie_break_order: [sleep, relationships, work, money, meaning]

  archetype:
    traits: [E, N, O]
    threshold: 3.0           # «высокий» = среднее > threshold; после 1000 тестов заменить медианами
    table:
      - {E: high, N: low,  O: high, id: pathfinder,      name: "Первооткрыватель"}
      - {E: high, N: low,  O: low,  id: organizer,       name: "Организатор"}
      - {E: high, N: high, O: high, id: inspirer,        name: "Вдохновитель"}
      - {E: high, N: high, O: low,  id: heart_of_party,  name: "Душа компании"}
      - {E: low,  N: low,  O: high, id: quiet_explorer,  name: "Тихий исследователь"}
      - {E: low,  N: low,  O: low,  id: steady_anchor,   name: "Надёжный якорь"}
      - {E: low,  N: high, O: high, id: sensitive_dreamer, name: "Чуткий мечтатель"}
      - {E: low,  N: high, O: low,  id: careful_keeper,  name: "Бережный хранитель"}

texts:
  domains:
    sleep: {name: "Сон и энергия", leak: "Тебе не хватает сил — а без них трудно радоваться даже хорошему."}
    relationships: {name: "Близкие люди", leak: "Тебе не хватает близости и поддержки — одна из главных опор счастья."}
    work: {name: "Работа и учёба", leak: "Работа сейчас больше забирает, чем даёт."}
    money: {name: "Деньги", leak: "Финансовая тревога отнимает спокойствие."}
    meaning: {name: "Смысл и цели", leak: "Не хватает ощущения, что жизнь движется туда, куда хочется."}
  archetypes:
    pathfinder: "Ты заряжаешься от людей и новых идей и легко переносишь неопределённость. Тебе важно движение."
    organizer: "Ты общителен, спокоен и практичен. Люди рядом с тобой чувствуют, что всё под контролем."
    inspirer: "Ты горишь идеями и людьми и глубоко всё проживаешь — и радость, и тревогу."
    heart_of_party: "Ты тянешься к людям и живо на всё откликаешься. Тебе важно, чтобы рядом были свои."
    quiet_explorer: "Ты черпаешь силы в тишине и любопытстве. Спокоен, вдумчив, любишь разбираться в сути."
    steady_anchor: "Ты спокоен, сдержан и последователен. На тебя можно опереться."
    sensitive_dreamer: "Ты тонко чувствуешь и много размышляешь. Богатый внутренний мир — твоя сила и твоя нагрузка."
    careful_keeper: "Ты бережно относишься к людям и привычному укладу и остро чувствуешь перемены."
