# Промпт платного отчёта (docs/LLM_REPORT.md) и проверка безопасности текста.
# Плейсхолдеры в user: $input_json, $domain_names, $low_index_threshold, $schema_example.
version: 1

system: |
  Ты — внимательный автор материалов о благополучии. Пиши по-русски, на «ты», тепло, конкретно и без
  пафоса. Опирайся только на переданные данные. Практики бери из доказательной психологии благополучия
  (сон, социальные связи, физическая активность, благодарность, осмысленные цели) и адаптируй под черты
  человека.

  Запрещено: ставить диагнозы и использовать клинические термины («депрессия», «тревожное расстройство»);
  обещать гарантированный результат; давать советы о лекарствах; упоминать политику, войну, экономику
  страны; упоминать MBTI и 16 типов Майерс-Бриггс; придумывать факты о человеке, которых нет во входных
  данных. Если низкий индекс — мягко добавь, что разговор со специалистом может помочь.

  Верни только JSON по схеме.

user: |
  Данные человека (агрегаты теста; черты — средние по шкале 1–5, домены — средние 1–5):
  $input_json

  Названия доменов для текста: $domain_names
  Низким считается индекс ниже $low_index_threshold.

  Требования:
  - leaks — ровно те три домена из входного поля leaks, в том же порядке, с теми же id в поле domain;
  - в каждом leaks.actions — от 3 до 5 шагов, выполнимых за неделю;
  - strengths_to_use — ровно 3 пункта;
  - plan_30_days — ровно 4 недели, week от 1 до 4, в каждой от 1 до 5 шагов;
  - не пиши числа черт и баллы доменов как есть — переводи их в слова.

  Ответ — только JSON без пояснений и без markdown, по схеме:
  $schema_example

# Регулярные выражения (без учёта регистра). Совпадение = отчёт не принимается (ретрай / fallback).
forbidden:
  diagnosis:
    - '\bдепресс\w*'
    - '\bтревожн\w*\s+расстройств\w*'
    - '\bрасстройств\w*\s+(личности|настроения|сна|пищевого)'
    - '\bдиагноз\w*'
    - '\bневроз\w*'
    - '\bпсихоз\w*'
    - '\bбиполяр\w*'
    - '\bклиническ\w*'
    - '(?-i:\bПТСР\b|\bСДВГ\b|\bОКР\b)'
  medication:
    - '\bантидепрессант\w*'
    - '\bтаблет\w*'
    - '\bлекарств\w*'
    - '\bпрепарат\w*'
    - '\bтранквилизатор\w*'
  mbti:
    - '\bMBTI\b'
    - '\bМайерс\w*'
    - '\bБриггс\w*'
    - '(?-i:\b[EI][NS][TF][JP]\b)'
  politics:
    - '\bполитик\w*'
    - '\bвойн\w*'
    - '(?-i:\bСВО\b)'
    - '\bсанкци\w*'
    - '\bмобилизац\w*'
    - '\bэкономик\w*\s+(страны|россии)'
    - '\bкризис\w*\s+в\s+стране'
  promises:
    - '\bгарантир\w*'
    - '\b100\s?%'
    - '\bнавсегда\b'
    - '\bвылеч\w*'
    - '\bизмени\w*\s+(твою\s+)?жизнь\s+за\b'
    - '\bточно\s+станешь\s+счастлив\w*'
