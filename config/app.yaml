# Контент и настройки, которые меняет владелец без правки кода

site_name: "Индекс счастья"

landing:
  # {trend} берётся из country_index.trend; если trend пустой — показывается headline_neutral
  headline_with_trend: "Индекс счастья в России {trend}. А какой у тебя?"
  headline_neutral: "Как у тебя с индексом счастья?"
  subheadline: "5 минут. Бесплатно. Без регистрации"

analysis_screen_ms: 2500   # экран «Анализируем твои ответы…» перед результатом, мс

consent:
  version: "draft-2026-10-30"   # меняй при каждой правке текста согласия на /consent

country_index:
  # Индекс ВЦИОМ = доля «счастливых» минус доля «несчастливых», НЕ средний балл.
  # Не сравнивать с личным индексом 0–100.
  value: 52
  share_happy: 0.74
  period: "апрель 2026"
  # Формулировка для заголовка лендинга — обновляй вместе с value и period. Пусто → нейтральный заголовок.
  trend: "упал до минимума за 15 лет"
  source_name: "ВЦИОМ"
  source_url: "https://wciom.ru/ratings/indeks-schastja"

# Строка под индексом на странице результата, по одной на вариант ответа на вопрос ВЦИОМ.
# Плейсхолдеры: {happy}, {unhappy}, {hard_to_say} — доли россиян в % (из country_index),
# {unhappy_one_in} — «каждый пятый» (из доли «нет»). Личный индекс 0–100 с ВЦИОМ не сравниваем.
vciom_result_texts:
  definitely_yes: "Ты среди {happy}% россиян, кто считает себя счастливым."
  rather_yes: "Ты скорее счастлив — и ты среди {happy}% россиян, кто считает себя счастливым."
  rather_no: "Сейчас ты не чувствуешь себя счастливым — так отвечает примерно {unhappy_one_in}. Ниже — что больше всего отнимает у тебя силы."
  definitely_no: "Сейчас ты не чувствуешь себя счастливым — так отвечает примерно {unhappy_one_in}. Ниже — что больше всего отнимает у тебя силы."
  hard_to_say: "Тебе сложно ответить однозначно — так отвечают около {hard_to_say}% россиян. Ниже — что сейчас сильнее всего влияет на твоё состояние."

pricing:
  ab_variants_rub: [490, 690, 990]
  refund_days: 14

payments:
  description: "Персональный отчёт «Индекс счастья»"   # в платеже и в чеке 54-ФЗ
  receipt:
    vat_code: 1   # 1 = без НДС. TODO: подтвердить с бухгалтером под налоговый режим (docs/LEGAL.md)

fake_door:
  name: "Трекер счастья"
  price_rub_month: 390

percentile:
  min_completed_tests: 500   # до этого порога строка «выше, чем у N%» не показывается

report:
  models:
    yandexgpt:
      model: "yandexgpt"          # YandexGPT Pro; modelUri = gpt://<YANDEXGPT_FOLDER_ID>/<model>/<version>
      # TODO: закрепить версию Pro 5.1 точным идентификатором из документации Yandex Cloud.
      # С плавающими ветками latest / rc / deprecated production не стартует.
      version: "latest"
    gigachat:
      model: "GigaChat-Pro"       # по умолчанию; для сравнения в eval: GigaChat (Lite), GigaChat-Max
  token_pricing:
    # Цены справочные на 30.10.2026 — сверяй с прайсом провайдера. Стоимость отчёта — в ₽ с НДС.
    usd_rub: 80.87    # курс ЦБ на 29.10.2026
    vat_rate: 0.22    # НДС в РФ с 01.01.2026
    prices:           # за 1000 токенов, ключ — model (без версии)
      "yandexgpt": {input: 0.0066, output: 0.0066, currency: USD, vat_included: false}  # Pro 5.1
      "GigaChat": {input: 0.065, output: 0.065, currency: RUB, vat_included: true}  # Lite
      "GigaChat-Pro": {input: 0.5, output: 0.5, currency: RUB, vat_included: true}
      "GigaChat-Max": {input: 0.65, output: 0.65, currency: RUB, vat_included: true}
  temperature: 0.5
  max_output_tokens: 3000
  max_attempts: 3
  attempt_timeout_seconds: 25
  deadline_seconds: 55            # отчёт должен открыться ≤ 60 с после оплаты
  budget_rub_per_report: 15       # ориентир финмодели; eval подсвечивает превышение
  low_index_threshold: 40         # ниже — мягкая рекомендация поговорить со специалистом

metrics:
  # Пороги MVP (SPEC §1), доли. Цвет в /admin: зелёный — нижняя граница 95% CI Уилсона выше go,
  # красный — верхняя граница ниже stop, серый — данных недостаточно.
  completion: {go: 0.60, stop: 0.45}            # test_complete / test_start
  share: {go: 0.08, stop: 0.04}                 # сессии с share_click / test_complete
  conversion: {go: 0.025, stop: 0.012}          # payment_success / test_complete
  subscription_interest: {go: 0.05, stop: null} # sub_fakedoor_click / payment_success
  ci_z: 1.96
  timezone: "Europe/Moscow"   # границы дней в фильтре периода /admin

rate_limits:
  # Запросов в минуту на сессию, без cookie — на IP (SPEC §8). Тест — 36 вопросов за 5–7 минут.
  answers: 60
  checkout: 10
  lead: 10
  events: 120

