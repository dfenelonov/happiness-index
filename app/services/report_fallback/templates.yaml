# Fallback-отчёт (docs/LLM_REPORT.md): собирается, если LLM недоступен 3 попытки подряд.
# Отчёт помечается status=fallback и позже перегенерируется (scripts/regenerate_reports.py).
# Плейсхолдеры: $index, $archetype, $leak_names.

summary: >-
  Твой индекс счастья — $index из 100, твой тип — «$archetype». Сейчас больше всего сил у тебя
  забирают три сферы: $leak_names. Ниже — разбор каждой из них, сильные стороны, на которые можно
  опереться, и план на ближайшие 30 дней.

low_index_note: >-
  Если тебе давно тяжело, разговор со специалистом — психологом или психотерапевтом — может
  помочь. Это нормальный и разумный шаг, а не признак слабости.

plan_last_week:
  focus: "Закрепить то, что работает"
  steps:
    - "Отметь, какие шаги из первых трёх недель прижились, и оставь их в расписании"
    - "Выбери одну свою сильную сторону и сознательно опирайся на неё в трудный момент"
    - "Запиши, что изменилось за месяц, — даже если перемены кажутся небольшими"

remeasure_note: >-
  Через 30 дней пройди тест снова — так ты увидишь, что изменилось и какие шаги сработали лучше всего.

archetypes:
  pathfinder:
    deep_dive: >-
      Ты заряжаешься от людей и новых идей и спокойно переносишь неопределённость. Тебе легко
      начинать: новые проекты, знакомства, поездки. Обратная сторона — интерес быстро гаснет, когда
      начинается рутина, и важные дела могут оставаться недоделанными. Тебе помогает, когда в жизни
      есть движение, но есть и пара опор, к которым ты возвращаешься каждый день.
    strengths:
      - "Любопытство: ты замечаешь возможности там, где другие видят тупик"
      - "Лёгкость в общении: тебе несложно попросить о помощи или предложить её"
      - "Устойчивость к переменам: неопределённость тебя скорее бодрит, чем пугает"
  organizer:
    deep_dive: >-
      Ты общителен, спокоен и практичен. Тебе важно, чтобы всё работало, и люди рядом это чувствуют.
      Ты хорошо держишь ритм и редко теряешься. Слепая зона — привычка всё тащить на себе и
      откладывать собственный отдых, пока дела не закончатся. А дела, как известно, не заканчиваются.
    strengths:
      - "Надёжность: на тебя можно положиться, и ты сам можешь на себя положиться"
      - "Умение доводить дела до конца даже тогда, когда скучно"
      - "Спокойствие: в сложной ситуации ты ищешь решение, а не виноватых"
  inspirer:
    deep_dive: >-
      Ты горишь идеями и людьми и глубоко проживаешь всё — и радость, и тревогу. Тебя легко
      вдохновить и легко ранить. Ты умеешь зажигать других, но после ярких периодов часто приходит
      усталость. Тебе помогает, когда у эмоций есть выход: разговор, запись, движение, творчество.
    strengths:
      - "Энтузиазм, который заражает и поднимает людей вокруг"
      - "Чуткость: ты тонко замечаешь настроение других"
      - "Воображение: ты видишь, как могло бы быть лучше, и умеешь об этом рассказать"
  heart_of_party:
    deep_dive: >-
      Ты тянешься к людям и живо на всё откликаешься. Рядом с близкими ты расцветаешь, а одиночество
      и напряжение в отношениях переносишь тяжелее других. Тебе важно, чтобы рядом были свои, и ты
      много вкладываешься в эти связи. Иногда стоит вкладываться так же щедро и в себя.
    strengths:
      - "Теплота: с тобой людям становится легче"
      - "Умение собирать людей вместе и создавать атмосферу"
      - "Эмоциональная открытость: ты не прячешь чувства и легко сближаешься"
  quiet_explorer:
    deep_dive: >-
      Ты черпаешь силы в тишине и любопытстве. Спокоен, вдумчив, любишь разбираться в сути. Тебе не
      нужна шумная компания, чтобы чувствовать себя хорошо, — нужны интересная задача и пара близких
      людей. Слепая зона — уйти в себя настолько, что другие не узнают, когда тебе нужна поддержка.
    strengths:
      - "Глубина: ты умеешь долго и сосредоточенно думать над важным"
      - "Самостоятельность: тебе хорошо и наедине с собой"
      - "Спокойствие, которое помогает принимать взвешенные решения"
  steady_anchor:
    deep_dive: >-
      Ты спокоен, сдержан и последователен. На тебя можно опереться: ты не мечешься и держишь слово.
      Привычный уклад даёт тебе силы, а резкие перемены ты предпочитаешь вводить постепенно. Риск —
      так привыкнуть к ровному ритму, что в нём становится мало радости. Небольшие новые впечатления
      помогают это исправить.
    strengths:
      - "Постоянство: ты умеешь держать полезные привычки месяцами"
      - "Ровность: тебя трудно выбить из колеи"
      - "Практичность: ты выбираешь то, что работает, а не то, что модно"
  sensitive_dreamer:
    deep_dive: >-
      Ты тонко чувствуешь и много размышляешь. Богатый внутренний мир — твоя сила и твоя нагрузка:
      ты замечаешь то, что другие пропускают, но и переживания у тебя глубже. Тебе помогает, когда
      мысли не крутятся в голове, а получают форму — в тексте, разговоре, творчестве — и когда у дня
      есть простые опоры: сон, прогулка, тёплый человек рядом.
    strengths:
      - "Эмпатия: ты по-настоящему понимаешь других"
      - "Творческое мышление и умение видеть необычные связи"
      - "Честность с собой: ты не отмахиваешься от своих чувств"
  careful_keeper:
    deep_dive: >-
      Ты бережно относишься к людям и привычному укладу и остро чувствуешь перемены. Тебе важно,
      чтобы мир был предсказуемым, и ты много делаешь, чтобы он таким был. Слепая зона — брать на
      себя слишком много тревоги за то, на что нельзя повлиять. Тебе помогает отделять то, что в
      твоих руках, от того, что нет.
    strengths:
      - "Заботливость: ты помнишь, что важно для близких"
      - "Внимательность к деталям и рискам"
      - "Верность: ты сохраняешь отношения и привычки, которые тебе дороги"

domains:
  sleep:
    why: >-
      Когда не хватает сна и энергии, всё остальное ощущается тяжелее: радость тускнеет, а мелкие
      трудности кажутся большими. Это первая сфера, с которой стоит начать, потому что она влияет на все остальные.
    actions:
      - "Выбери время отбоя и держи его пять вечеров подряд, даже в выходные"
      - "За час до сна убери телефон из спальни"
      - "Выходи на дневной свет хотя бы на 15 минут в первой половине дня"
      - "Сделай одну короткую прогулку или разминку каждый день"
  relationships:
    why: >-
      Близкие отношения — одна из самых надёжных опор благополучия. Когда их не хватает, даже
      хорошие события радуют меньше, а трудности приходится нести в одиночку.
    actions:
      - "Напиши или позвони одному важному человеку без повода"
      - "Договорись о встрече вживую на этой неделе"
      - "Расскажи кому-то из близких, что тебя сейчас волнует"
      - "Каждый вечер вспоминай один момент, когда тебе было хорошо с другими"
  work:
    why: >-
      Работа или учёба занимают большую часть дня. Если они больше забирают, чем дают, усталость
      копится, и на остальную жизнь остаётся мало сил.
    actions:
      - "Выпиши задачи, которые дают силы, и задачи, которые отнимают, и посмотри на соотношение"
      - "Добавь в каждый рабочий день короткий перерыв без экрана"
      - "Обсуди с руководителем или коллегой одну вещь, которую можно изменить"
      - "Определи время, после которого ты не отвечаешь на рабочие сообщения"
  money:
    why: >-
      Финансовая тревога отнимает спокойствие даже тогда, когда денег объективно хватает. Ощущение
      контроля над финансами часто важнее самой суммы.
    actions:
      - "Запиши все расходы за неделю, чтобы увидеть реальную картину"
      - "Выбери одну регулярную трату, от которой можно отказаться без потерь"
      - "Отложи небольшую сумму в отдельный резерв — важен сам шаг, а не размер"
      - "Назначь один день в неделю, когда ты спокойно разбираешься с финансами"
  meaning:
    why: >-
      Ощущение, что жизнь движется в нужную сторону, даёт силы проходить через трудности. Когда его
      не хватает, дни сливаются, и сложно понять, ради чего стараться.
    actions:
      - "Запиши три вещи, которые для тебя по-настоящему важны"
      - "Выбери одну маленькую цель на месяц, связанную с одной из них"
      - "Каждый вечер отмечай один шаг, который приблизил тебя к этой цели"
      - "Найди час на этой неделе для дела, которое тебя увлекает"
