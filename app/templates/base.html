<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_config.site_name }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ app_config.landing.subheadline }}{% endblock %}">
  {% block og %}{% endblock %}
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
</head>
<body class="min-h-screen bg-amber-50 text-stone-800 antialiased">
  <main class="mx-auto max-w-md px-4 pb-10 pt-6">
    {% block content %}{% endblock %}
  </main>
  <footer class="mx-auto max-w-md px-4 pb-8 text-xs leading-relaxed text-stone-500">
    <nav class="mb-2 flex flex-wrap gap-x-4 gap-y-1">
      <a class="underline" href="/offer">Оферта</a>
      <a class="underline" href="/privacy">Политика ПДн</a>
      <a class="underline" href="/consent">Согласие</a>
      <a class="underline" href="/cookies">Cookie</a>
    </nav>
    <p>Не является медицинской услугой и не заменяет консультацию специалиста.</p>
  </footer>
</body>
</html>
