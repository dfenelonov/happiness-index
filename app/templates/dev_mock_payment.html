{% extends "base.html" %}
{% block title %}Мок ЮKassa{% endblock %}
{% block content %}
{# Только для разработки: имитация страницы оплаты, пока нет ключей тестового магазина. #}
<section class="rounded-3xl border-2 border-dashed border-stone-400 bg-white p-6">
  <p class="text-sm font-semibold uppercase tracking-wide text-stone-500">Мок ЮKassa · dev</p>
  <p class="mt-3 text-3xl font-bold text-stone-900">{{ payment.amount | int }} ₽</p>
  <p class="mt-1 text-sm text-stone-500">Платёж {{ payment.id }} · статус {{ payment.status }}</p>
  <form method="post" class="mt-6 space-y-2">
    <button name="action" value="pay" class="min-h-[48px] w-full rounded-2xl bg-emerald-600 font-semibold text-white">Оплатить</button>
    <button name="action" value="cancel" class="min-h-[48px] w-full rounded-2xl border border-stone-300 font-semibold">Отменить</button>
    <button name="action" value="refund" class="min-h-[48px] w-full rounded-2xl border border-stone-300 font-semibold">Вернуть деньги</button>
  </form>
</section>
{% endblock %}
