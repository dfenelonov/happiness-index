<section class="pt-4">
  <h1 class="text-2xl font-bold text-stone-900">Перед началом</h1>
  <p class="mt-4 text-stone-600">
    Тест анонимный: мы не спрашиваем имя и почту. Твои ответы нужны только для того, чтобы посчитать результат.
    Около 30 вопросов, 5–7 минут.
  </p>
  <form method="post" action="/consent" class="mt-6">
    <label class="flex items-start gap-3 rounded-2xl bg-white p-4 shadow-sm">
      <input type="checkbox" name="agree" value="yes" class="mt-1 h-5 w-5 shrink-0 accent-amber-500">
      <span class="text-sm text-stone-700">
        Я соглашаюсь на обработку моих ответов в соответствии с
        <a class="underline" href="/privacy" target="_blank">политикой обработки данных</a>
        и даю <a class="underline" href="/consent" target="_blank">согласие на обработку</a>.
      </span>
    </label>
    {% if error %}<p class="mt-3 text-sm font-medium text-rose-700" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="mt-6 flex min-h-[52px] w-full items-center justify-center rounded-2xl bg-amber-500 px-6 text-lg font-semibold text-white shadow-sm active:bg-amber-600">Начать тест</button>
  </form>
</section>
